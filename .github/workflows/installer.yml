name: installer

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y bc bison flex kmod libelf-dev libssl-dev qemu-system-x86 qemu-utils
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: zig build

      # The q has to arrive after the ui is up, and the pipe has to stay open
      # until then, or qemu sees EOF and the guest never gets the keystroke.
      # Newline included in case the tty is still line-buffered.
      - name: boot to the installer and quit it
        run: |
          (sleep 20; printf 'q\n'; sleep 5) | timeout 120 zig build qemu > boot.log 2>&1 || true
          cat -v boot.log

      # vaxis moves the cursor rather than writing spaces, so a phrase never
      # appears contiguously -- only single words do. '/dev/vda' is the ui's,
      # the kernel writes '[vda]'.
      - name: it drew, it found the disk qemu gave it, and it left
        run: |
          grep -q 'zibudi' boot.log || { echo "the ui never drew"; exit 1; }
          grep -q '/dev/vda' boot.log || { echo "no disk enumerated"; exit 1; }
          grep -q 'loop' boot.log && { echo "loop devices were offered as targets"; exit 1; }
          grep -q 'reboot: Power down' boot.log || { echo "init did not exit cleanly"; exit 1; }
